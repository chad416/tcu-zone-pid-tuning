[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcutune"
version = "0.2.0"
description = "Physics-based TCU zone model, identification and PI tuning tool, and a cooling-valve linearisation that keeps one tuning robust over the operating envelope; Siemens SCL for TIA Portal V18"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tcu-tune = "tcutune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
